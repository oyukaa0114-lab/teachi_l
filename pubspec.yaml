name: teachi_l
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.0
  crypto: ^3.0.3
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  flutter_plugin_android_lifecycle: ^2.0.19
  url_launcher: ^6.2.0
  image_picker: ^1.0.0
  excel: ^4.0.6
  path_provider: ^2.1.0
  open_file: ^3.3.2
  intl: ^0.19.0
  http: ^1.2.0
  flutter_dotenv: ^6.0.0
  universal_html: ^2.3.0
  shared_preferences: ^2.2.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
 
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/logo.bg.png"
    background_color: "#1A1A2E"
    theme_color: "#B71C1C"

  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo.bg.png